:root{
 color-scheme:dark;
 /* fundos: um único marrom (o mesmo do cabeçalho), sem textura */
 --bg:#241711;          /* fundo principal (nogueira) */
 --card:#241711;        /* cartões, painéis, campos */
 --head-bg:rgba(36,23,17,.88); /* cabeçalho */
 --foot-bg:#241711;     /* rodapé */
 --ph:#241711;          /* fundo atrás das fotos */
 --glow:radial-gradient(ellipse 560px 460px at 108% 260px,rgba(229,53,155,.20),rgba(229,53,155,0) 72%); /* brilho rosa (use none p/ desligar) */
 /* textos */
 --ink:#FFF3E6;         /* texto principal (creme claro) */
 --mut:#CDB197;         /* texto secundário (madeira clara) */
 --cream:#F6DFC6;       /* creme: textos de respiro */
 --foot-ink:#E6CDB4;    /* texto do rodapé */
 --on-banner:#FFFFFF;   /* texto sobre imagens de banner */
 /* destaque (rosa da marca) */
 --acc:#D12A8E;        /* botões/fundos com texto branco (contraste 4.7:1) */
 --acc-t:#FF5CB5;      /* rosa para TEXTO em fundo escuro (contraste 6:1) */
 --acc2:#FF5CB5;        /* hover */
 --on-acc:#FFFFFF;      /* texto sobre botões rosa */
 /* linhas e camadas */
 --line:#4D3427;
 --scrim:rgba(14,8,5,.78);       /* fundo do pop-up */
 --overlay:transparent;    /* véu sobre banners */
 --chip:rgba(36,23,17,.85);      /* botão fechar do pop-up */
 --banner-from:#241711;         /* banner sem imagem: marrom -> rosa */
 --banner-to:#C2287F;
 --ok:#5DB487;                  /* pedido concluído */
 /* tipografia */
 --font-display:'Nunito',system-ui,sans-serif;
 --font-logo:'Pacifico','Brush Script MT',cursive; /* só a marca em texto */
 --font-body:'Nunito',system-ui,sans-serif;
 --font-label:'Nunito',system-ui,sans-serif; /* preços, etiquetas, rótulos */
 --w-display:800;
 --s-display:normal;    /* italic | normal */
 --t-display:none;      /* none | uppercase */
 --t-label:none;        /* none | uppercase */
 --ls-label:.02em;
 /* formas */
 --r-card:22px;         /* cartões e pop-up (0 = quadrado) */
 --r-btn:999px;         /* botões */
 --r-input:14px;        /* campos */
}

.zm{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff;pointer-events:none;transition:transform .2s,background .2s;z-index:1}
.zm svg{width:17px;height:17px}.item:hover .zm{background:var(--acc);color:var(--on-acc);transform:scale(1.12)}
.md{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:16px}
.md[hidden]{display:none}
.mb{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;padding:16px 16px 20px;position:relative;border:1px solid var(--line)}
.mb .x{position:absolute;right:8px;top:6px;z-index:3;background:var(--chip);color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:18px}
.mg{position:relative}
.mcar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.mcar::-webkit-scrollbar{display:none}
.ms{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;background:var(--ph)}
.ms img{width:100%;height:100%;object-fit:cover;display:block}
.mar{top:45%}.mar[data-d="-1"]{left:8px}.mar[data-d="1"]{right:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
.mp{color:var(--acc-t);font-weight:700;font-size:18px;margin:4px 0 10px}
.mp .old{font-size:15px}
.mt{color:var(--mut);white-space:pre-line;margin-bottom:16px}
.mb .acts{flex-direction:row;gap:8px}.mb .rd{padding:12px;font-size:14px}.mb .sq{width:48px;height:44px}
/* admin */
/* painel: organização profissional */
#admin .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:6;background:var(--bg);margin:10px 0 16px;padding:8px 0;border-bottom:1px solid var(--line)}
#admin .tabs::-webkit-scrollbar{display:none}#admin .tabs button{white-space:nowrap;flex:0 0 auto}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card,12px);margin:0 0 10px;overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .gt{flex:1;display:grid;gap:2px}details.grp>summary .gt b{font-size:15px}details.grp>summary .gt small{color:var(--mut);font-size:12px;font-weight:400}
details.grp>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.grp[open]>summary::after{transform:rotate(-135deg)}
details.grp[open]>summary{border-bottom:1px solid var(--line)}
details.grp>.gb{display:grid;gap:10px;padding:14px 16px 16px}
.form.gp{background:none;border:0;padding:0;margin:0}
.sbar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px}
.sbar .msg{margin:0}
.sc{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card,12px);padding:12px 14px;margin-bottom:10px}
.sc .sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--acc);color:var(--acc-t);font-weight:700;font-size:13px}
.sc .si{min-width:0;display:grid;gap:2px}.sc .si b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc .si small{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .st{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-t);font-weight:700}
.sc .sa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sc .sa button:disabled{opacity:.3}
@media(max-width:520px){.sc{grid-template-columns:34px 1fr}.sc .sa{grid-column:1/-1;justify-content:flex-start}}
.sadd{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.sadd button{flex:1;min-width:110px}
#hb{background:var(--acc);color:var(--on-acc,#111);text-align:center;padding:12px 16px;font-weight:600;font-size:14px;line-height:1.4}
body.fechado .item .acts button,body.fechado #md .rd,body.fechado #md .sq{opacity:.45;filter:grayscale(.5)}
#send:disabled{opacity:.5;cursor:not-allowed}
.hrw{display:grid;grid-template-columns:minmax(74px,1fr) 112px auto 112px;gap:6px;align-items:center}.hrw input[type=time]{padding:8px 4px 8px 10px;min-width:0;font-size:14px}.hrw .ck{font-size:14px}
#admin{display:none;max-width:900px;margin:auto;padding:5vh 5vw}
body.adm #shop{display:none}body.adm #admin{display:block}
#admin h1{font-size:38px;margin-bottom:18px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row img{width:52px;height:65px;object-fit:cover;background:var(--card)}
.row .n{flex:1}
.sm{background:none;border:1px solid var(--line);padding:6px 12px}
.form[hidden]{display:none}
.form{display:grid;gap:10px;background:var(--card);padding:18px;margin:18px 0;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{color:var(--acc-t);min-height:22px;font-size:14px}
label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ═══ TEMA — ESTILO: só usa as variáveis do bloco TEMA; não precisa editar por cliente ═══ */
body{background:var(--glow) top center/100% 1100px no-repeat,var(--bg)}
header{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.serif{font-style:var(--s-display)}
.item,.feat .item{border-radius:var(--r-card);background:var(--card)}
.item .ph{border-radius:calc(var(--r-card) - 8px)}
.item h3{font-family:var(--font-display);font-style:var(--s-display);font-weight:800;font-size:15px;line-height:1.25}
.item .pr,.mp{font-family:var(--font-label);font-weight:800;letter-spacing:.01em}
.item .pr{font-size:11.5px}
.tag{font-family:var(--font-label);text-transform:var(--t-label);letter-spacing:.1em;color:var(--acc-t);border:1px solid var(--line);background:var(--bg)}
.btn,.sq{border-radius:var(--r-btn)}
input,textarea,select{border-radius:var(--r-input)}
.panel,.form,.ord,.mb{border-radius:var(--r-card)}
.ln img,.row img{border-radius:10px}
.sh h2{font-size:clamp(30px,5vw,44px)}
.tx h2{font-size:clamp(32px,5.5vw,48px)}
.bn h2{font-size:clamp(36px,7vw,64px)}
.sh i{width:min(220px,60%);height:1px;position:relative;background:linear-gradient(90deg,transparent,var(--acc) 38%,transparent 38%,transparent 62%,var(--acc) 62%,transparent)}
.sh i::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--acc);transform:translate(-50%,-50%) rotate(45deg)}
footer .fg b{font-family:var(--font-label);text-transform:var(--t-label);letter-spacing:var(--ls-label);font-size:12px}
.cp{font-family:var(--font-label);text-transform:var(--t-label);letter-spacing:.08em;font-size:11px}
.tabs{border-bottom:0;gap:8px}
.tabs button{border:1px solid var(--line);border-radius:var(--r-btn);padding:8px 16px}
.tabs .on{border:1px solid var(--acc);color:var(--acc-t);background:var(--card);font-family:var(--font-display);font-style:var(--s-display);font-size:17px}
@media(min-width:800px){.item h3{font-size:19px}.item .pr{font-size:13px}}

/* ═══ painel + espaçamento ═══ */
.bag{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.bag .ci{flex:none;filter:drop-shadow(0 0 6px rgba(199,154,85,.35))}
.lb{display:block;font-family:var(--font-label);font-size:11px;letter-spacing:var(--ls-label);text-transform:var(--t-label);color:var(--acc-t);margin-top:8px}
textarea{resize:vertical;line-height:1.5;overflow-wrap:anywhere}
.item .ds,.mt,.tx p,.bn p{white-space:pre-line;overflow-wrap:anywhere}
.tx{padding:4vh 6vw 1vh}.tx p{margin:8px 0 14px}
.ps{padding:4vh 5vw 1vh}
footer{margin-top:5vh}
#secs:has(>.bn:last-child)~footer{margin-top:0}
.og{border:0;padding:0;margin:14px 0}.og legend{font-family:var(--font-display);font-weight:var(--w-display);text-transform:var(--t-display);font-size:18px;margin-bottom:6px}.og legend i{color:var(--mut);font-size:12px;font-family:var(--font-body);font-style:normal;text-transform:none}#op .mb{padding:22px;max-height:88vh;overflow:auto}
.stars{display:flex;gap:4px;margin:10px 0}.stars button{background:none;border:0;font-size:38px;line-height:1;color:var(--line);cursor:pointer;padding:0 4px}.stars button.on{color:var(--acc-t)}
.avg{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:800px){.avg{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* avaliações em carrossel: 1 central e metade de cada vizinha */
.avw{position:relative;max-width:980px;margin:auto}
.avw .avg{display:flex;grid-template-columns:none;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 0;--cw:50%;--g:10px;align-items:stretch}
.avw .avg::-webkit-scrollbar{display:none}
.avw .avg::before,.avw .avg::after{content:'';flex:0 0 calc((100% - var(--cw))/2 - var(--g))}
.avw .avc{padding:12px;font-size:13.5px;flex:0 0 var(--cw);scroll-snap-align:center;opacity:.5;transform:scale(.94);transition:opacity .35s,transform .35s;align-content:start}
.avw .avc.on{opacity:1;transform:none}
@media(min-width:800px){.avw .avg{--cw:50%;gap:16px;--g:16px}}
.avw .ar2{display:grid;place-items:center;position:absolute;top:12%;z-index:2;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;line-height:1;box-shadow:0 2px 12px rgba(0,0,0,.4);animation:nudge 1.8s ease-in-out 3}
.ar2[data-d="-1"]{left:4px}.ar2[data-d="1"]{right:4px}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--nx,4px))}}
.ar2[data-d="-1"]{--nx:-4px}
.ar2{top:calc(50% - 18px)}
.avc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:grid;gap:8px}.avc .stt{color:var(--acc-t);letter-spacing:2px}.avc p{margin:0;white-space:pre-line;overflow-wrap:anywhere}.avc small{color:var(--mut)}
.logo.serif{font-family:var(--font-logo);font-weight:400}
/* ═══ RE.ALMA 3.0 — loja colorida ═══ */
#secs>.ps,#ex>.ps{--bg:#FBF1E3;--card:#fff;--ink:#2B1A10;--mut:#7A5A44;--acc-t:#C7237F;--line:#EBD8C2;background:#FBF1E3;color:var(--ink);box-shadow:0 0 0 100vmax #FBF1E3;clip-path:inset(0 -100vmax);padding-bottom:5vh}
#secs>.ps .item,#ex .item{background:#fff;border:1px solid #EBD8C2;box-shadow:0 6px 18px rgba(80,40,10,.07)}
#secs>.ps .item h3{color:#2B1A10}#secs>.ps .old{color:#A68B76}
.sh h2{color:var(--ink)}
.dif{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:8px;padding:22px 4vw;background:var(--foot-bg);color:var(--cream);text-align:center}
.dif div{display:flex;flex-direction:column;align-items:center;gap:8px}.dif svg{color:var(--acc2)}.dif span{font:700 12px/1.3 var(--font-body)}
.agd{display:grid;gap:10px;max-width:560px;margin:auto}.ag{background:#fff;border:1px solid #EBD8C2;border-radius:14px;padding:14px 16px;display:grid;gap:2px}.ag b{color:var(--acc-t);font-weight:800}.ag small{color:var(--mut)}
.lj{text-align:center;display:grid;gap:10px;justify-items:center;max-width:520px;margin:auto}.lj p{margin:0}.lj .btn{margin-top:6px}
.dsc{padding:0 0 8px}.dsc .dl{display:flex;justify-content:space-between;color:var(--acc2);font-weight:800;padding:6px 0}.dsc .dh{background:rgba(229,53,155,.14);border:1px dashed var(--acc);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;color:var(--cream)}
@media(max-width:560px){.dif{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}}
#secs:empty{min-height:100vh;min-height:100svh}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* notificações do painel + aviso de poucas unidades */
#ntf{display:none;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;flex-direction:column;gap:8px;width:min(92vw,420px)}
body.adm #ntf{display:flex}
.toast{background:var(--card);color:var(--ink);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.45);font-size:14px;line-height:1.35;cursor:pointer;animation:tin .25s ease-out}
.toast b{display:block;color:var(--acc-t);margin-bottom:2px}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.bdg{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--acc);color:var(--on-acc);font-size:11px;font-weight:700;line-height:18px}
.lw{font-size:12px;font-weight:700;color:var(--acc-t);text-align:center;margin:-4px 0 8px}
#mc .lw{text-align:left;font-size:14px;margin:2px 0 8px}
.ln .lw{text-align:left;font-size:12px;margin:3px 0 0}
#fq .fqr{display:flex;gap:8px}#fq .fqr input{flex:1;min-width:0}#fq .fqr button{flex:0 0 auto;padding:0 18px;border:1px solid var(--acc);background:transparent;color:var(--acc-t);border-radius:12px;font-weight:700;cursor:pointer}#fq .fqr button:disabled{opacity:.5}#fq small{color:var(--mut)}#fopt{display:grid;gap:8px}
#fa .fqr,#rt .fqr{display:flex;gap:8px}#fa .fqr input,#rt .fqr input{flex:1;min-width:0}
.etq{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.6;font-size:14px;display:grid;gap:4px}.etq a{color:var(--acc-t);font-weight:700}
body.co #wfab,body.adm #wfab,body[style*="overflow: hidden"] #wfab{display:none}

/* ═══ pedidos no painel (borda rosa + blocos separados) ═══ */
.ord.ped{border:2px solid var(--acc);padding:0;gap:0;margin:16px 0;overflow:hidden}
.ped-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;background:rgba(209,42,142,.14)}
.ped-h .who{display:grid;gap:3px;min-width:0}.ped-h .who b{font-size:16px;overflow-wrap:anywhere}.ped-h small{color:var(--mut)}
.ped-h .val{font-weight:800;font-size:18px;color:var(--acc-t);white-space:nowrap}
.ped-s{padding:12px 16px;border-top:1px solid var(--acc);display:grid;gap:6px}
.ped-s>.lb{margin:0}
.kv{display:grid;grid-template-columns:92px 1fr;gap:5px 10px;font-size:14px;line-height:1.5}.kv dt{color:var(--mut)}.kv dd{overflow-wrap:anywhere}
.ped-it>div{padding:7px 0;border-top:1px dashed var(--line);line-height:1.5}.ped-it>div:first-child{border-top:0;padding-top:0}
.ord.ped .etq{border:0;background:none;padding:0;margin:0}
.bd{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;margin-left:8px;border-radius:99px;border:1px solid var(--acc);color:var(--acc-t);vertical-align:middle}
.bd.ret{background:var(--acc);color:var(--on-acc)}
/* faixa de promoção da loja toda */
#pb{background:linear-gradient(100deg,var(--acc),var(--acc2),var(--acc),var(--acc2));background-size:300% 100%;color:var(--on-acc);text-align:center;padding:11px 5vw;font-weight:800;font-size:13px;line-height:1.35;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 14px rgba(0,0,0,.18);position:relative;z-index:3;animation:pbm 9s ease-in-out infinite alternate}
#pb .pbp{background:rgba(255,255,255,.92);color:#1a1a1a;border-radius:99px;padding:3px 11px;font-size:12.5px;letter-spacing:0;box-shadow:0 1px 6px rgba(0,0,0,.2)}
#pb span{text-shadow:0 1px 2px rgba(0,0,0,.22)}
@keyframes pbm{from{background-position:0 50%}to{background-position:100% 50%}}
/* anti-estouro lateral: cards nunca alargam a coluna; nada empurra a página para os lados */
.item{min-width:0}
html,body{max-width:100%;overflow-x:clip}
@supports not (overflow:clip){html{overflow-x:hidden}}
/* faixa de promoção em movimento (a cada ~5 s dá uma volta completa e recomeça) */
#pb.mv{display:block;overflow:hidden;padding:11px 0;text-align:left}
#pb .pbk{display:flex;width:max-content;animation:pbs var(--pbd,5s) linear infinite;will-change:transform}
#pb .pbg{display:flex;flex:none}
#pb .pbs{display:inline-flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;white-space:nowrap;padding-right:48px;flex:none}
#pb.mv:active .pbk{animation-play-state:paused}
@keyframes pbs{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#pb{animation:none}}

/* preço com promoção: nunca vaza do cartão — se não couber, o preço novo desce para a linha de baixo */
#shop .item .pr,.item .pr{display:flex!important;flex-wrap:wrap!important;justify-content:center!important;align-items:baseline;column-gap:6px;row-gap:0;min-width:0;max-width:100%;line-height:1.25;overflow-wrap:anywhere}
#shop .item .pr .old,.item .pr .old{margin-right:0!important;white-space:nowrap}
#shop .item .pr .promo,.item .pr .promo{white-space:nowrap}
.mp{display:flex!important;flex-wrap:wrap;align-items:baseline;column-gap:8px;min-width:0}
.mp .old{margin-right:0!important}
</style>
</head>

<section class="ps" id="sres" hidden></section>

async function rmFoto(url){const n=url&&url.split('/produtos/')[1];if(n)try{await sb.storage.from('produtos').remove([n.split('?')[0]])}catch(e){}}
function crop(file,W=480,H=600,Q=.68){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;
  const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(im,(W-w)/2,(H-h)/2,w,h);
  c.toBlob(b=>{if(b&&b.type==='image/webp')ok(b);else c.toBlob(j=>j?ok(j):no(),'image/jpeg',Math.min(.95,Q+.05))},'image/webp',Q)};im.onerror=no;im.src=URL.createObjectURL(file)})}
async function save1(){
  const m=$('fmsg'),nome=$('fn').value.trim();if(!nome){m.textContent='Informe o nome da peça.';return}
  m.textContent='Salvando…';
  try{
    const l=pf(editing||{}),rm=[...document.querySelectorAll('.fr:checked')].map(e=>+e.value),pr=document.querySelector('input[name=pp]:checked');
    for(const j of rm)await rmFoto(l[j]);
    let keep=l.filter((_,j)=>!rm.includes(j));
    if(pr){const u=l[+pr.value];if(u&&keep.includes(u))keep=[u,...keep.filter(x=>x!==u)]}
    for(const f of [...$('ff').files]){const bl=await crop(f),path=Date.now()+Math.random().toString(36).slice(2,6)+(bl.type==='image/webp'?'.webp':'.jpg'),{error}=await sb.storage.from('produtos').upload(path,bl,{contentType:bl.type,cacheControl:'31536000'});if(error)throw error;keep.push(sb.storage.from('produtos').getPublicUrl(path).data.publicUrl)}
    const promoV=parseFloat($('fpr').value)||0;const row={nome,descricao:$('fd').value.trim(),detalhes:$('fx').value.trim(),preco:parseFloat($('fp').value)||0,promo:promoV>0?promoV:null,estoque:parseInt($('fs').value)||0,ativo:$('fa').checked,secoes:[...document.querySelectorAll('.fsc:checked')].map(e=>e.value),opcoes:[...document.querySelectorAll('.fop:checked')].map(e=>e.value),foto_url:keep[0]||null,fotos:keep};
    const{error}=editing?await sb.from('produtos').update(row).eq('id',editing.id):await sb.from('produtos').insert(row);
    if(error)throw error;adminList();
  }catch(e){m.textContent='Não foi possível salvar: '+(e.message||'tente novamente.')+' (rode o SQL novo)'}
}

function initAvCar(){
 const g=$('avl'),w=g.parentNode,ar=w.querySelectorAll('.ar2'),orig=[...g.querySelectorAll('.avc')],N=orig.length;
 if(!N)return;ar.forEach(a=>a.hidden=N<2);
 const loop=N>=3;
 if(loop){const mk=(f)=>orig.forEach(e=>{const c=e.cloneNode(true);c.setAttribute('aria-hidden','true');f(c)});
  [...orig].reverse().forEach(e=>{const c=e.cloneNode(true);c.setAttribute('aria-hidden','true');g.insertBefore(c,g.querySelector('.avc'))});
  orig.forEach(e=>{const c=e.cloneNode(true);c.setAttribute('aria-hidden','true');g.appendChild(c)})}
 const cs=[...g.querySelectorAll('.avc')],base=loop?N:0;
 const pos=i=>cs[i].offsetLeft+cs[i].offsetWidth/2-g.clientWidth/2;
 const jump=x=>{g.style.scrollSnapType='none';g.scrollLeft=x;requestAnimationFrame(()=>g.style.scrollSnapType='')};
 const mark=()=>{const m=g.scrollLeft+g.clientWidth/2;let b=0,d=1e9;cs.forEach((c,i)=>{const k=Math.abs(c.offsetLeft+c.offsetWidth/2-m);if(k<d){d=k;b=i}});cs.forEach((c,i)=>c.classList.toggle('on',i===b));g._cur=b};
 const go=i=>{i=Math.max(0,Math.min(cs.length-1,i));g.scrollTo({left:pos(i),behavior:'smooth'})};
 let r,t;g.addEventListener('scroll',()=>{cancelAnimationFrame(r);r=requestAnimationFrame(mark);if(!loop)return;clearTimeout(t);t=setTimeout(()=>{const i=g._cur;if(i<N)jump(pos(i+N));else if(i>=2*N)jump(pos(i-N))},140)});
 ar.forEach(a=>a.onclick=()=>{go((g._cur==null?base:g._cur)+Number(a.dataset.d));hold()});
 let pause=false,tm;const hold=()=>{pause=true;clearTimeout(tm);tm=setTimeout(()=>pause=false,12000)};
 ['touchstart','pointerdown','wheel'].forEach(ev=>g.addEventListener(ev,hold,{passive:true}));
 w.addEventListener('mouseenter',()=>pause=true);w.addEventListener('mouseleave',()=>pause=false);
 if(N>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{if(pause||document.hidden)return;const q=g.getBoundingClientRect();if(q.top<innerHeight&&q.bottom>0)go((g._cur==null?base:g._cur)+1)},5500);
 const start=()=>{jump(pos(base));requestAnimationFrame(mark)};
 requestAnimationFrame(()=>requestAnimationFrame(start));addEventListener('resize',()=>{jump(pos(g._cur==null?base:g._cur));mark()})}

/* ====== HORÁRIO DE FUNCIONAMENTO (bloqueia pedidos fora do horário) ====== */
let HO=0;const DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
try{fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'}).then(r=>{const d=r.headers.get('date');if(d&&!isNaN(Date.parse(d)))HO=Date.parse(d)-Date.now();applyHor()}).catch(()=>{})}catch(e){}
function spNow(){const d=new Date(Date.now()+HO),p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d),g=t=>p.find(x=>x.type==t).value;return{wd:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')),m:(+g('hour'))*60+(+g('minute'))}}
const hm=t=>{const[h,m]=String(t||'0:0').split(':');return(+h||0)*60+(+m||0)},hf=t=>{const[h,m]=String(t).split(':');return +m?+h+'h'+m:+h+'h'};
function horStatus(){const h=CAB.hor||{};if(h.fechado)return{open:false};if(!h.on||!Array.isArray(h.dias)||h.dias.length<7)return{open:true};
 const{wd,m}=spNow(),D=h.dias,ok=d=>d&&d.on!==false&&d.a&&d.f,t=D[wd],y=D[(wd+6)%7];
 if(ok(t)){const a=hm(t.a),f=hm(t.f);if(a==f)return{open:true};if(a<f?(m>=a&&m<f):m>=a)return{open:true}}
 if(ok(y)){const a=hm(y.a),f=hm(y.f);if(a>f&&m<f)return{open:true}}
 for(let k=0;k<8;k++){const d=D[(wd+k)%7];if(!ok(d))continue;if(k==0&&m>=hm(d.a))continue;return{open:false,next:'Abrimos '+(k==0?'hoje':k==1?'amanhã':'na '+DN[(wd+k)%7].toLowerCase())+' às '+hf(d.a)+'.'}}
 return{open:false}}
const hMsg=st=>((CAB.hor&&CAB.hor.msg)||'Estamos fechados no momento.')+(st.next?' '+st.next:'');
function blockClosed(){const st=horStatus();if(st.open)return false;alert(hMsg(st));return true}
function applyHor(){const st=horStatus(),hb=$('hb'),c=!st.open;document.body.classList.toggle('fechado',c);
 if(hb){hb.hidden=!c;if(c)hb.textContent=hMsg(st)}
 const sd=$('send');if(sd){if(!sd.dataset.t)sd.dataset.t=sd.textContent;sd.disabled=c;sd.textContent=c?'Loja fechada':sd.dataset.t}}

/* ====== BARRA DE NAVEGAÇÃO DAS SEÇÕES + BOTÃO FLUTUANTE DO WHATSAPP ====== */
let SNO=null;
function renderSnav(){
 const L=SEC||DEF,items=L.map((x,i)=>({i,t:String(x.titulo||'').trim(),k:x.t})).filter(o=>o.t&&o.k!='banner'&&o.k!='texto'&&o.k!='cats'&&o.k!='difs');
 const nav=$('snav');
 if(!nav){if(SNO){SNO.disconnect();SNO=null}return}
 if(items.length<2){nav.hidden=true;nav.innerHTML='';if(SNO){SNO.disconnect();SNO=null}return}
 nav.innerHTML=items.map(o=>`<a href="#s${o.i}" data-i="${o.i}">${esc(o.t)}</a>`).join('');
 nav.hidden=false;
 {const h=$('hd');if(h)document.documentElement.style.setProperty('--hh',Math.round(h.getBoundingClientRect().height-1)+'px')}
 nav.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById('s'+a.dataset.i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
 if(SNO)SNO.disconnect();
 const marks=items.map(o=>document.getElementById('s'+o.i)).filter(Boolean);
 if(!marks.length)return;
 const vis=new Map();
 SNO=new IntersectionObserver(es=>{es.forEach(e=>vis.set(e.target.id,e.intersectionRatio));
  let best=null,top=0;vis.forEach((r,id)=>{if(r>top){top=r;best=id}});
  if(best)nav.querySelectorAll('a').forEach(a=>{const on='s'+a.dataset.i===best;a.classList.toggle('on',on);if(on&&nav.scrollWidth>nav.clientWidth)nav.scrollTo({left:a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2,behavior:'smooth'})})
 },{rootMargin:'-20% 0px -65% 0px',threshold:[0,.1,.25,.5,.75,1]});
 marks.forEach(el=>SNO.observe(el))
}
